[constants]
ndk = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64'

[binaries]
ar = ndk / 'bin/llvm-ar'
c = [ndk / 'bin/x86_64-linux-android35-clang', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
cpp = [ndk / 'bin/x86_64-linux-android35-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
c_ld = 'lld'
cpp_ld = 'lld'
strip = ndk / 'bin/llvm-strip'
rust = ['rustc', '--target', 'x86_64-linux-android', '-C', 'linker=' + ndk / 'bin/x86_64-linux-android35-clang']
pkg-config = ['/usr/bin/pkgconf']

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/build/native/nvk-android/sys/lib/pkgconfig'
bindgen_clang_arguments = ['-target', 'x86_64-linux-android35', '--sysroot', ndk / 'sysroot']

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
