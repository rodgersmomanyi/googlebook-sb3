# Meson cross file: Android x86_64, NDK r27c, API 34, libc++ shared (renamed to libc++_lcam.so after build)
[constants]
ndk = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/'
sr = '/build/native/camera-userspace/sysroot'

[binaries]
c = ndk + 'x86_64-linux-android34-clang'
cpp = ndk + 'x86_64-linux-android34-clang++'
ar = ndk + 'llvm-ar'
strip = ndk + 'llvm-strip'
objcopy = ndk + 'llvm-objcopy'
pkg-config = '/usr/bin/pkgconf'
c_ld = 'lld'
cpp_ld = 'lld'

[built-in options]
c_args = ['-I' + sr + '/include', '-fPIC']
cpp_args = ['-I' + sr + '/include', '-fPIC']
c_link_args = ['-L' + sr + '/lib']
cpp_link_args = ['-L' + sr + '/lib']

[properties]
needs_exe_wrapper = true
pkg_config_libdir = sr + '/lib/pkgconfig'
sys_root = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot'

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
