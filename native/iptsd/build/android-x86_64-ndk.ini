[binaries]
c = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang'
cpp = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++'
ar = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
nm = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm'
ranlib = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
strip = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
objcopy = '/build/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy'
# never pick up the build host's pkg-config / cmake packages: every dependency comes from subprojects/
pkg-config = '/bin/false'
cmake = '/bin/false'

[built-in options]
c_args = ['--target=x86_64-linux-android34', '-fPIE']
cpp_args = ['--target=x86_64-linux-android34', '-fPIE']
c_link_args = ['--target=x86_64-linux-android34', '-static', '-fuse-ld=lld']
cpp_link_args = ['--target=x86_64-linux-android34', '-static', '-static-libstdc++', '-fuse-ld=lld']

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
